<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="CROSS! Chicken">
  <!-- Soft ground contact shadow -->
  <ellipse cx="24" cy="43" rx="14" ry="3.5" fill="#071A4D" fill-opacity="0.22" />

  <!-- Orange feet -->
  <rect x="18" y="38" width="3.5" height="5" rx="1.5" fill="#FF9F1A" stroke="#B57E00" stroke-width="0.75" />
  <rect x="26.5" y="38" width="3.5" height="5" rx="1.5" fill="#FF9F1A" stroke="#B57E00" stroke-width="0.75" />

  <!-- 3-Lobed Signature Red Comb -->
  <circle cx="21" cy="9.5" r="3.2" fill="#FF2E44" stroke="#9E1B24" stroke-width="0.8" />
  <circle cx="25" cy="8" r="3.6" fill="#FF2E44" stroke="#9E1B24" stroke-width="0.8" />
  <circle cx="28.5" cy="10" r="3" fill="#FF2E44" stroke="#9E1B24" stroke-width="0.8" />

  <!-- Side wings (Solid White) -->
  <ellipse cx="14" cy="27" rx="3.5" ry="5.5" transform="rotate(-15 14 27)" fill="#FFFFFF" stroke="#0F2657" stroke-width="1.2" />
  <ellipse cx="34" cy="27" rx="3.5" ry="5.5" transform="rotate(15 34 27)" fill="#FFFFFF" stroke="#0F2657" stroke-width="1.2" />

  <!-- Solid White Plump Body -->
  <ellipse cx="24" cy="28" rx="12" ry="11" fill="#FFFFFF" stroke="#0F2657" stroke-width="1.6" />

  <!-- Solid White Round Head -->
  <circle cx="24" cy="18" r="9.5" fill="#FFFFFF" stroke="#0F2657" stroke-width="1.6" />

  <!-- Red Wattle under beak -->
  <path d="M 23.2 24.5 C 22.2 26.5 22.5 28 24 28.5 C 25.5 28 25.8 26.5 24.8 24.5 Z" fill="#FF2E44" stroke="#9E1B24" stroke-width="0.6" />

  <!-- Cute Beak -->
  <polygon points="24,20 20.5,23.5 27.5,23.5" fill="#FF9F1A" stroke="#D97706" stroke-width="0.9" stroke-linejoin="round" />

  <!-- Expressive Cartoon Eyes -->
  <ellipse cx="20.5" cy="17" rx="1.8" ry="2.4" fill="#0F172A" />
  <circle cx="21.1" cy="16.2" r="0.75" fill="#FFFFFF" />

  <ellipse cx="27.5" cy="17" rx="1.8" ry="2.4" fill="#0F172A" />
  <circle cx="28.1" cy="16.2" r="0.75" fill="#FFFFFF" />
</svg>
